services:
  api:
    command: uvicorn scam2market.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    restart: always
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      ENVIRONMENT: production
      AUTH_REQUIRED: "true"
      DEVELOPMENT_AUTH_ENABLED: "false"
      RATE_LIMIT_FAIL_CLOSED: "true"
    volumes: !reset []
    ports: !reset []
  tls-gateway:
    image: caddy:2.10-alpine
    restart: always
    read_only: true
    tmpfs: ["/config"]
    environment:
      SCAM2MARKET_DOMAIN: ${SCAM2MARKET_DOMAIN:?SCAM2MARKET_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
  postgres:
    ports: !reset []
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  redis:
    ports: !reset []
    restart: always
  redpanda:
    ports: !reset []
    restart: always
  neo4j:
    ports: !reset []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  qdrant:
    ports: !reset []
  mlflow:
    ports: !reset []
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
  otel-collector:
    ports: !reset []

volumes:
  caddy-data:
