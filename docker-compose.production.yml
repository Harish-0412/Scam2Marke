services:
  api:
    command: uvicorn scam2market.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    restart: always
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      ENVIRONMENT: production
      AUTH_REQUIRED: "true"
      DEVELOPMENT_AUTH_ENABLED: "false"
      RATE_LIMIT_FAIL_CLOSED: "true"
    volumes: !reset []
  postgres:
    ports: !reset []
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  redis:
    ports: !reset []
    restart: always
  redpanda:
    ports: !reset []
    restart: always
  neo4j:
    ports: !reset []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  qdrant:
    ports: !reset []
  mlflow:
    ports: !reset []
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
  otel-collector:
    ports: !reset []
