x-backend-service: &backend-service
  build: .
  image: ${SCAM2MARKET_IMAGE:-scam2market-backend:local}

services:
  api:
    <<: *backend-service
    command: uvicorn scam2market.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    environment:
      DATABASE_URL: postgresql+asyncpg://scam2market:scam2market@postgres:5432/scam2market
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend-service
    command: alembic upgrade head
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    depends_on:
      postgres:
        condition: service_healthy

  topic-init:
    <<: *backend-service
    command: python scripts/create_topics.py
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    depends_on:
      redpanda:
        condition: service_healthy

  feature-worker:
    <<: *backend-service
    command: scam2market-feature-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  intelligence-worker:
    <<: *backend-service
    command: scam2market-intelligence-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  campaign-worker:
    <<: *backend-service
    command: scam2market-campaign-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime-worker:
    <<: *backend-service
    command: scam2market-realtime-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    <<: *backend-service
    command: scam2market-notification-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  evidence-worker:
    <<: *backend-service
    command: scam2market-evidence-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  narrative-worker:
    <<: *backend-service
    command: scam2market-narrative-worker
    profiles: ["intelligence"]
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  verification-worker:
    <<: *backend-service
    command: scam2market-verification-worker
    profiles: ["intelligence"]
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  disclosure-connector:
    <<: *backend-service
    command: scam2market-disclosure-connector
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  outbox-worker:
    <<: *backend-service
    command: scam2market-outbox-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
  
  threat-feed-worker:
    <<: *backend-service
    command: python -m scam2market.workers.threat_feed_worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  explainability-worker:
    <<: *backend-service
    command: python -m scam2market.workers.explainability_worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  telemetry-persistence:
    <<: *backend-service
    command: scam2market-telemetry-persistence
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  archive-worker:
    <<: *backend-service
    command: scam2market-archive-worker
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
      - raw-data:/app/data/raw
    depends_on:
      raw-volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  raw-volume-init:
    <<: *backend-service
    user: root
    command: ["sh", "-c", "chown -R scam2market:scam2market /app/data/raw"]
    volumes:
      - raw-data:/app/data/raw

  market-ingestor:
    <<: *backend-service
    command: scam2market-market-ingestor
    profiles: ["demo", "live"]
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
      - raw-data:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure
  explainability-service:
    <<: *backend-service
    command: uvicorn scam2market.intelligence.explainability_service:app --host 0.0.0.0 --port 8001
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

  threat-feed-service:
    <<: *backend-service
    command: uvicorn scam2market.intelligence.threat_feed:app --host 0.0.0.0 --port 8002
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

  social-ingestor:
    <<: *backend-service
    command: scam2market-social-ingestor
    profiles: ["demo", "live"]
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
      - raw-data:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure

  replay-scheduler:
    <<: *backend-service
    command: scam2market-replay
    profiles: ["demo"]
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
      - raw-data:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  replay-control-worker:
    <<: *backend-service
    command: scam2market-replay-control
    env_file:
      - "${SCAM2MARKET_ENV_FILE:-.env.example}"
    volumes:
      - ./src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: scam2market
      POSTGRES_USER: scam2market
      POSTGRES_PASSWORD: scam2market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scam2market -d scam2market"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5-community
    profiles: ["intelligence"]
    environment:
      NEO4J_AUTH: neo4j/scam2market-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p scam2market-password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["intelligence"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    profiles: ["intelligence"]
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: development-only-change-me
    ports:
      - "3001:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"

volumes:
  postgres-data:
  raw-data:
  neo4j-data:
  qdrant-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
