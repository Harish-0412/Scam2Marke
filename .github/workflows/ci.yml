name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests scripts alembic

      - name: Lint
        run: python -m ruff check src tests scripts alembic

      - name: Type-check
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest

      - name: Validate migration generation
        run: python -m alembic upgrade head --sql > /dev/null

  container:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag scam2market-backend:ci .
