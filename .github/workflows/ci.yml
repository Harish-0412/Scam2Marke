name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: scam2market
          POSTGRES_USER: scam2market
          POSTGRES_PASSWORD: scam2market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scam2market -d scam2market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://scam2market:scam2market@localhost:5432/scam2market
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests scripts alembic

      - name: Lint
        run: python -m ruff check src tests scripts alembic

      - name: Type-check
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest

      - name: Apply and reverse database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head

  container:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag scam2market-backend:ci .
