apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: scam2market-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: scam2market-api}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.cpuUtilization }}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: scam2market-api}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: scam2market-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to: [{namespaceSelector: {}}]
    - to: [{ipBlock: {cidr: {{ .Values.network.privateCidr }}}}]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9094}
        - {protocol: TCP, port: 7687}
        - {protocol: TCP, port: 6333}
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}, {protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
