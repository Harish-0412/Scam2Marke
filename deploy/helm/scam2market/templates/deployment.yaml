apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scam2market.name" . }}-api
  labels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ include "scam2market.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "scam2market.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: ENVIRONMENT, value: {{ .Values.config.environment | quote }}}
            - {name: AUTH_REQUIRED, value: {{ .Values.config.authRequired | quote }}}
            - {name: DEVELOPMENT_AUTH_ENABLED, value: {{ .Values.config.developmentAuthEnabled | quote }}}
            - {name: KAFKA_SECURITY_PROTOCOL, value: {{ .Values.config.kafkaSecurityProtocol | quote }}}
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /api/v1/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}, initialDelaySeconds: 20, periodSeconds: 15, failureThreshold: 3}
          startupProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 5, failureThreshold: 30}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: scam2market, app.kubernetes.io/component: api}
