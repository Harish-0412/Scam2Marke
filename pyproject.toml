[project]
name = "scam2market-backend"
version = "0.1.0"
description = "Event-time-aware pump-and-dump intelligence backend for Scam2Market."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "aiokafka>=0.11.0",
  "orjson>=3.10.7",
  "python-json-logger>=2.0.7",
  "pyarrow>=17.0.0",
]

[project.scripts]
scam2market-market-ingestor = "scam2market.workers.market_ingestor:main"
scam2market-social-ingestor = "scam2market.workers.social_ingestor:main"
scam2market-feature-worker = "scam2market.workers.stream_worker:main"
scam2market-intelligence-worker = "scam2market.workers.intelligence_worker:main"
scam2market-outbox-worker = "scam2market.workers.outbox_worker:main"
scam2market-replay = "scam2market.workers.replay_scheduler:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.6",
  "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scam2market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
