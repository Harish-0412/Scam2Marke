[project]
name = "scam2market-backend"
version = "0.1.0"
description = "Event-time-aware pump-and-dump intelligence backend for Scam2Market."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "aiokafka>=0.11.0",
  "orjson>=3.10.7",
  "python-json-logger>=2.0.7",
  "pyarrow>=17.0.0",
  "PyYAML>=6.0.2",
  "qdrant-client>=1.15.0,<2",
  "neo4j>=6.0.0,<7",
  "numpy>=1.26.0,<3",
  "prometheus-client>=0.21.0,<1",
  "httpx>=0.27.0,<1",
  "PyJWT[crypto]>=2.9.0,<3",
  "opentelemetry-api>=1.27.0,<2",
  "opentelemetry-sdk>=1.27.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
]

[project.scripts]
scam2market-market-ingestor = "scam2market.workers.market_ingestor:main"
scam2market-social-ingestor = "scam2market.workers.social_ingestor:main"
scam2market-feature-worker = "scam2market.workers.stream_worker:main"
scam2market-intelligence-worker = "scam2market.workers.intelligence_worker:main"
scam2market-outbox-worker = "scam2market.workers.outbox_worker:main"
scam2market-replay = "scam2market.workers.replay_scheduler:main"
scam2market-replay-control = "scam2market.workers.replay_scheduler:control_worker_main"
scam2market-telemetry-persistence = "scam2market.workers.telemetry_persistence_worker:main"
scam2market-archive-worker = "scam2market.workers.archive_worker:main"
scam2market-campaign-worker = "scam2market.workers.campaign_worker:main"
scam2market-narrative-worker = "scam2market.workers.graph_worker:main"
scam2market-verification-worker = "scam2market.workers.verification_worker:main"
scam2market-disclosure-connector = "scam2market.workers.disclosure_connector_worker:main"
scam2market-realtime-worker = "scam2market.workers.realtime_worker:main"
scam2market-evidence-worker = "scam2market.workers.evidence_worker:main"
scam2market-notification-worker = "scam2market.workers.notification_worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.6",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scam2market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true
